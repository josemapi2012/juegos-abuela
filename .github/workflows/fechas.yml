name: Días especiales (calendario de Google)
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fechas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q icalendar recurring-ical-events
      - name: Leer el calendario
        env:
          CALENDARIO: ${{ secrets.CALENDARIO }}
        run: python3 .github/fechas.py
      - name: Publicar las fechas
        run: |
          git config user.name "fechas"
          git config user.email "fechas@users.noreply.github.com"
          git add fechas.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "Días especiales" && git push)
